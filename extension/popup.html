<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<style>
  body { width: 300px; margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: #0c120f; color: #e7f0eb; padding: 14px; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p  { font-size: 12px; color: #789085; margin: 0 0 10px; line-height: 1.5; }
  label { display: block; font-size: 11px; color: #789085; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; padding: 7px 8px; background: #0e1612; border: 1px solid #284236; color: #e7f0eb; border-radius: 6px; font-size: 12.5px; }
  #status { font-size: 11.5px; margin: 8px 0; min-height: 14px; }
  #status.ok { color: #7fe3ae; }
  #status.err { color: #ff5c5c; }
  button { width: 100%; padding: 8px; border: 1px solid #06c755; background: #06c755; color: #04140c; font-weight: 600; border-radius: 6px; cursor: pointer; font-size: 13px; }
  a { display: block; text-align: center; font-size: 12px; color: #7fe3ae; margin-top: 10px; text-decoration: none; }
</style>
</head>
<body>
  <h1>MONITOR 747 · bridge</h1>
  <p>URL ของ backend/dashboard (เช่น https://xxx.onrender.com)</p>
  <label for="url">Backend URL</label>
  <input id="url" type="text" placeholder="http://localhost:3000" />
  <div id="status"></div>
  <button id="save">บันทึกและทดสอบ</button>
  <a href="#" id="dash">เปิด dashboard</a>
  <script src="popup.js"></script>
</body>
</html>
